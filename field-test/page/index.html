<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:">
  <title>rooms76 scanner field test</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; --bg: var(--tg-theme-bg-color, #fff); --fg: var(--tg-theme-text-color, #111); --hint: var(--tg-theme-hint-color, #888); --btn: var(--tg-theme-button-color, #2481cc); --btn-fg: var(--tg-theme-button-text-color, #fff); }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, sans-serif; }
    #viewfinder { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 10px; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    #guide { position: absolute; left: 10%; right: 10%; top: 35%; bottom: 35%; border: 2px solid rgba(255,255,255,.8); border-radius: 6px; }
    #status { margin: 10px 0; min-height: 2.8em; }
    .hint { color: var(--hint); font-size: 13px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    button { flex: 1; padding: 12px; border: 0; border-radius: 8px; background: var(--btn); color: var(--btn-fg); font-size: 15px; }
    button.secondary { background: transparent; color: var(--btn); border: 1px solid var(--btn); }
    input { flex: 2; padding: 12px; font-size: 17px; border-radius: 8px; border: 1px solid var(--hint); background: transparent; color: var(--fg); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="viewfinder"><video id="video" playsinline muted autoplay></video><div id="guide"></div></div>
  <div class="row" id="zoomRow" hidden>
    <span class="hint">Zoom:</span>
    <button class="secondary" data-zoom="1">1×</button>
    <button class="secondary" data-zoom="1.5">1.5×</button>
    <button class="secondary" data-zoom="2">2×</button>
  </div>
  <div id="status">Loading…</div>

  <div id="promptQuestion" hidden>
    <p>Read <b id="readCode"></b> in <b id="readMs"></b>.<br>Did a camera permission prompt appear on this open?</p>
    <div class="row">
      <button data-prompt="yes">Yes</button>
      <button data-prompt="no">No</button>
    </div>
  </div>

  <div id="typed">
    <p class="hint">No camera, or the scan won't read? Type the digits under the barcode:</p>
    <div class="row">
      <input id="digits" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 4337185000000" autocomplete="off">
      <button id="sendDigits">Send</button>
    </div>
    <div class="row"><button class="secondary" id="giveUp">Can't read it: log a failed live scan</button></div>
    <p class="hint">You can also close this and send a photo of the barcode to the bot.</p>
  </div>
  <p class="hint" id="version"></p>
  <script type="module" src="scanner.js"></script>
</body>
</html>
